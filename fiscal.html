<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinançaSX - Fiscal</title>

    <link rel="stylesheet" href="css/fsx.css">

    <script src="fsx.js" defer></script>
</head>

<body>

    <canvas id="bg"></canvas>

    <div class="app-shell">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="mobile-menu-header">

                <div class="brand">
                    <strong>Finança<span>SX</span></strong>
                    <small>Controle financeiro</small>
                </div>

                <button
                    id="mobileMenuToggle"
                    class="mobile-menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                    ☰
                </button>

            </div>

            <div class="brand desktop-brand">
                <strong>Finança<span>SX</span></strong>
                <small>Controle financeiro</small>
            </div>

            <nav class="nav" id="fsxMobileNav">

                <a href="index.html"
                   class="nav-btn"
                   data-page="index.html">
                    Dashboard
                </a>

                <a href="lancamentos.html"
                   class="nav-btn"
                   data-page="lancamentos.html">
                    Lançamentos
                </a>

                <a href="metas.html"
                   class="nav-btn"
                   data-page="metas.html">
                    Metas
                </a>

                <a href="orcamento.html"
                   class="nav-btn"
                   data-page="orcamento.html">
                    Orçamento
                </a>

                <a href="graficos.html"
                   class="nav-btn"
                   data-page="graficos.html">
                    Gráficos
                </a>

                <a href="fiscal.html"
                   class="nav-btn"
                   data-page="fiscal.html">
                    Fiscal
                </a>

            </nav>

        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">

            <div class="topbar">

                <div>
                    <span class="eyebrow">CONTROLE</span>
                    <h1>Resumo fiscal</h1>
                    <p>Acompanhe suas movimentações por ano.</p>
                </div>

                <div class="form-group">

                    <label for="anoFiscal">Ano</label>

                    <select id="anoFiscal">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                    </select>

                </div>

            </div>

            <div id="alert" class="alert"></div>

            <!-- INDICADORES FINANCEIROS -->
            <section class="cards">

                <article class="card">
                    <span class="card-label">Receitas</span>
                    <strong id="fiscalReceitas">
                        R$ 0,00
                    </strong>
                </article>

                <article class="card">
                    <span class="card-label">Despesas</span>
                    <strong id="fiscalDespesas">
                        R$ 0,00
                    </strong>
                </article>

                <article class="card">
                    <span class="card-label">Saldo anual</span>
                    <strong id="fiscalSaldo">
                        R$ 0,00
                    </strong>
                </article>

                <article class="card">
                    <span class="card-label">Investimentos</span>
                    <strong id="fiscalInvestimentos">
                        R$ 0,00
                    </strong>
                </article>

                <article class="card">
                    <span class="card-label">Movimentações</span>
                    <strong id="fiscalMovimentacoes">
                        0
                    </strong>
                </article>

            </section>

        </main>

    </div>

</body>
</html>
