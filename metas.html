<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinançaSX - Metas</title>

    <link rel="stylesheet" href="css/fsx.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="fsx.js" defer></script>
</head>

<body>

    <canvas id="bg"></canvas>

    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="mobile-menu-header">

                <div class="brand">
                    <strong>Finança<span>SX</span></strong>
                    <small>Controle financeiro</small>
                </div>

                <button
                    id="mobileMenuToggle"
                    class="mobile-menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                    ☰
                </button>

            </div>

            <div class="brand desktop-brand">
                <strong>Finança<span>SX</span></strong>
                <small>Controle financeiro</small>
            </div>

            <nav class="nav" id="fsxMobileNav">

                <a href="index.html" class="nav-btn" data-page="index.html">
                    Dashboard
                </a>

                <a href="lancamentos.html" class="nav-btn" data-page="lancamentos.html">
                    Lançamentos
                </a>

                <a href="metas.html" class="nav-btn" data-page="metas.html">
                    Metas
                </a>

                <a href="orcamento.html" class="nav-btn" data-page="orcamento.html">
                    Orçamento
                </a>

                <a href="graficos.html" class="nav-btn" data-page="graficos.html">
                    Gráficos
                </a>

                <a href="fiscal.html" class="nav-btn" data-page="fiscal.html">
                    Fiscal
                </a>

            </nav>

        </aside>


        <!-- MAIN -->
        <main class="main-content">

            <div class="topbar">

                <div>
                    <span class="eyebrow">PLANEJAMENTO</span>
                    <h1>Metas financeiras</h1>
                    <p>Defina um objetivo e acompanhe seu progresso.</p>
                </div>

            </div>


            <div id="alert" class="alert"></div>


            <section class="grid-main">

                <article class="panel">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">OBJETIVO</span>
                            <h3>Minha meta</h3>
                        </div>

                    </div>


                    <div id="metaInput">

                        <div class="form-group">

                            <label for="metaTitulo">
                                Nome da meta
                            </label>

                            <input
                                type="text"
                                id="metaTitulo"
                                placeholder="Ex.: Comprar um computador">

                        </div>


                        <div class="form-group">

                            <label for="metaValor">
                                Valor da meta
                            </label>

                            <input
                                type="number"
                                id="metaValor"
                                step="0.01"
                                min="0"
                                placeholder="0,00">

                        </div>


                        <button
                            type="button"
                            id="saveGoalBtn"
                            class="btn primary">
                            Salvar meta
                        </button>

                    </div>

                </article>


                <article class="panel">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">PROGRESSO</span>
                            <h3 id="metaNomeExibida2">
                                Meta principal
                            </h3>
                        </div>

                    </div>


                    <div class="goal-dashboard">

                        <strong id="metaPercent2">
                            0%
                        </strong>

                        <div class="progress">

                            <div
                                id="metaBar2"
                                class="progress-bar"
                                style="width: 0%">
                            </div>

                        </div>


                        <div class="goal-info">

                            <span id="metaValor2">
                                R$ 0,00
                            </span>

                        </div>


                        <p id="metaHint2">
                            Configure sua meta para começar.
                        </p>

                    </div>

                </article>

            </section>

        </main>

    </div>

</body>
</html>
