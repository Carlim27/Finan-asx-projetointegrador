<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinançaSX - Gráficos</title>

    <link rel="stylesheet" href="css/fsx.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="fsx.js" defer></script>
</head>

<body>

    <canvas id="bg"></canvas>

    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="mobile-menu-header">

                <div class="brand">
                    <strong>Finança<span>SX</span></strong>
                    <small>Controle financeiro</small>
                </div>

                <button
                    id="mobileMenuToggle"
                    class="mobile-menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                    ☰
                </button>

            </div>

            <div class="brand desktop-brand">
                <strong>Finança<span>SX</span></strong>
                <small>Controle financeiro</small>
            </div>

            <nav class="nav" id="fsxMobileNav">

                <a href="index.html" class="nav-btn" data-page="index.html">
                    Dashboard
                </a>

                <a href="lancamentos.html" class="nav-btn" data-page="lancamentos.html">
                    Lançamentos
                </a>

                <a href="metas.html" class="nav-btn" data-page="metas.html">
                    Metas
                </a>

                <a href="orcamento.html" class="nav-btn" data-page="orcamento.html">
                    Orçamento
                </a>

                <a href="graficos.html" class="nav-btn" data-page="graficos.html">
                    Gráficos
                </a>

                <a href="fiscal.html" class="nav-btn" data-page="fiscal.html">
                    Fiscal
                </a>

            </nav>

        </aside>


        <!-- MAIN -->
        <main class="main-content">

            <div class="topbar">

                <div>
                    <span class="eyebrow">ANÁLISE</span>
                    <h1>Gráficos</h1>
                    <p>Visualize o comportamento das suas finanças.</p>
                </div>

            </div>


            <div id="alert" class="alert"></div>


            <section class="charts-grid">

                <article class="panel chart-card">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">RESUMO</span>
                            <h3>Visão geral</h3>
                        </div>

                    </div>

                    <div class="chart-container">
                        <canvas id="overviewChart"></canvas>
                    </div>

                </article>


                <article class="panel chart-card">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">CATEGORIAS</span>
                            <h3>Gastos por categoria</h3>
                        </div>

                    </div>

                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>

                </article>


                <article class="panel chart-card">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">EVOLUÇÃO</span>
                            <h3>Movimentação mensal</h3>
                        </div>

                    </div>

                    <div class="chart-container">
                        <canvas id="monthlyChart"></canvas>
                    </div>

                </article>

            </section>

        </main>

    </div>

</body>
</html>
