<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinançaSX - Lançamentos</title>

    <link rel="stylesheet" href="css/fsx.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="fsx.js" defer></script>
</head>

<body>

    <canvas id="bg"></canvas>

    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="mobile-menu-header">

                <div class="brand">
                    <strong>Finança<span>SX</span></strong>
                    <small>Controle financeiro</small>
                </div>

                <button
                    id="mobileMenuToggle"
                    class="mobile-menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                    ☰
                </button>

            </div>

            <div class="brand desktop-brand">
                <strong>Finança<span>SX</span></strong>
                <small>Controle financeiro</small>
            </div>

            <nav class="nav" id="fsxMobileNav">

                <a href="index.html" class="nav-btn" data-page="index.html">
                    Dashboard
                </a>

                <a href="lancamentos.html" class="nav-btn" data-page="lancamentos.html">
                    Lançamentos
                </a>

                <a href="metas.html" class="nav-btn" data-page="metas.html">
                    Metas
                </a>

                <a href="orcamento.html" class="nav-btn" data-page="orcamento.html">
                    Orçamento
                </a>

                <a href="graficos.html" class="nav-btn" data-page="graficos.html">
                    Gráficos
                </a>

                <a href="fiscal.html" class="nav-btn" data-page="fiscal.html">
                    Fiscal
                </a>

            </nav>

        </aside>


        <!-- MAIN -->
        <main class="main-content">

            <div class="topbar">

                <div>
                    <span class="eyebrow">FINANÇAS</span>
                    <h1>Lançamentos</h1>
                    <p>Registre e acompanhe suas movimentações.</p>
                </div>

            </div>


            <div id="alert" class="alert"></div>


            <section class="grid-main">

                <!-- FORMULÁRIO -->
                <article class="panel">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">REGISTRO</span>
                            <h3>Novo lançamento</h3>
                        </div>

                    </div>


                    <form id="transactionForm">

                        <input
                            type="hidden"
                            id="editingId">


                        <div class="form-group">

                            <label for="desc">
                                Descrição
                            </label>

                            <input
                                type="text"
                                id="descricao"
                                placeholder="Ex.: Mercado"
                                required>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="valor">
                                    Valor
                                </label>

                                <input
                                    type="number"
                                    id="valor"
                                    step="0.01"
                                    min="0"
                                    placeholder="0,00"
                                    required>

                            </div>


                            <div class="form-group">

                                <label for="tipo">
                                    Tipo
                                </label>

                                <select id="tipo">

                                    <option value="entrada">
                                        Entrada
                                    </option>

                                    <option value="saida">
                                        Saída
                                    </option>

                                </select>

                            </div>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="cat">
                                    Categoria
                                </label>

                                <select id="cat"></select>

                            </div>


                            <div class="form-group">

                                <label for="pagamento">
                                    Pagamento
                                </label>

                                <select id="pagamento">

                                    <option value="Pix">
                                        Pix
                                    </option>

                                    <option value="Dinheiro">
                                        Dinheiro
                                    </option>

                                    <option value="Cartão de débito">
                                        Cartão de débito
                                    </option>

                                    <option value="Cartão de crédito">
                                        Cartão de crédito
                                    </option>

                                    <option value="Transferência">
                                        Transferência
                                    </option>

                                    <option value="Outro">
                                        Outro
                                    </option>

                                </select>

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="dataLancamento">
                                Data
                            </label>

                            <input
                                type="date"
                                id="dataLancamento"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="obs">
                                Observação
                            </label>

                            <textarea
                                id="observaçao"
                                rows="3"
                                placeholder="Opcional"></textarea>

                        </div>


                        <div class="form-actions">

                            <button
                                type="submit"
                                id="submitBtn"
                                class="btn primary">
                                Salvar lançamento
                            </button>

                            <button
                                type="button"
                                id="cancelEditBtn"
                                class="btn secondary"
                                hidden>
                                Cancelar
                            </button>

                        </div>

                    </form>

                </article>


                <!-- FILTROS -->
                <article class="panel">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">FILTROS</span>
                            <h3>Pesquisar lançamentos</h3>
                        </div>

                    </div>


                    <div class="form-group">

                        <label for="searchInput">
                            Buscar
                        </label>

                        <input
                            type="search"
                            id="searchInput"
                            placeholder="Pesquisar...">

                    </div>


                    <div class="form-group">

                        <label for="filterTipo">
                            Tipo
                        </label>

                        <select id="filterTipo">

                            <option value="">
                                Todos
                            </option>

                            <option value="entrada">
                                Entradas
                            </option>

                            <option value="saida">
                                Saídas
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="filterCategoria">
                            Categoria
                        </label>

                        <select id="filterCategoria">

                            <option value="">
                                Todas
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="filterMes">
                            Mês
                        </label>

                        <select id="filterMes">

                            <option value="">
                                Todos
                            </option>

                        </select>

                    </div>


                    <button
                        type="button"
                        id="clearFiltersBtn"
                        class="btn secondary">
                        Limpar filtros
                    </button>

                </article>

            </section>


            <!-- LISTA -->
            <section class="panel">

                <div class="panel-header">

                    <div>
                        <span class="eyebrow">HISTÓRICO</span>
                        <h3>Lançamentos</h3>
                    </div>

                    <span id="transactionCounter">
                        0 lançamentos
                    </span>

                </div>


                <div
                    id="list"
                    class="transactions-list">
                </div>


                <div
                    id="pagination"
                    class="pagination">

                    <button
                        type="button"
                        id="prevPageBtn"
                        class="btn secondary">
                        Anterior
                    </button>

                    <span id="pageInfo">
                        Página 1
                    </span>

                    <button
                        type="button"
                        id="nextPageBtn"
                        class="btn secondary">
                        Próxima
                    </button>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
