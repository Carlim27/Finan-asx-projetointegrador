<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinançaSX - Orçamento</title>

    <link rel="stylesheet" href="css/fsx.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="fsx.js" defer></script>
</head>

<body>

    <canvas id="bg"></canvas>

    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="mobile-menu-header">

                <div class="brand">
                    <strong>Finança<span>SX</span></strong>
                    <small>Controle financeiro</small>
                </div>

                <button
                    id="mobileMenuToggle"
                    class="mobile-menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                    ☰
                </button>

            </div>

            <div class="brand desktop-brand">
                <strong>Finança<span>SX</span></strong>
                <small>Controle financeiro</small>
            </div>

            <nav class="nav" id="fsxMobileNav">

                <a href="index.html" class="nav-btn" data-page="index.html">
                    Dashboard
                </a>

                <a href="lancamentos.html" class="nav-btn" data-page="lancamentos.html">
                    Lançamentos
                </a>

                <a href="metas.html" class="nav-btn" data-page="metas.html">
                    Metas
                </a>

                <a href="orcamento.html" class="nav-btn" data-page="orcamento.html">
                    Orçamento
                </a>

                <a href="graficos.html" class="nav-btn" data-page="graficos.html">
                    Gráficos
                </a>

                <a href="fiscal.html" class="nav-btn" data-page="fiscal.html">
                    Fiscal
                </a>

            </nav>

        </aside>


        <!-- MAIN -->
        <main class="main-content">

            <div class="topbar">

                <div>
                    <span class="eyebrow">PLANEJAMENTO</span>
                    <h1>Orçamento</h1>
                    <p>Defina limites para suas categorias.</p>
                </div>

            </div>


            <div id="alert" class="alert"></div>


            <section class="grid-main">

                <article class="panel">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">LIMITE</span>
                            <h3>Novo orçamento</h3>
                        </div>

                    </div>


                    <div class="form-group">

                        <label for="budgetCategoria">
                            Categoria
                        </label>

                        <select id="budgetCategoria"></select>

                    </div>


                    <div class="form-group">

                        <label for="budgetValor">
                            Limite mensal
                        </label>

                        <input
                            type="number"
                            id="budgetValor"
                            step="0.01"
                            min="0"
                            placeholder="0,00">

                    </div>


                    <button
                        type="button"
                        id="saveBudgetBtn"
                        class="btn primary">
                        Salvar orçamento
                    </button>

                </article>


                <article class="panel">

                    <div class="panel-header">

                        <div>
                            <span class="eyebrow">CONTROLE</span>
                            <h3>Meus orçamentos</h3>
                        </div>

                    </div>


                    <div
                        id="budgetList"
                        class="budget-list">
                    </div>

                </article>

            </section>

        </main>

    </div>

</body>
</html>
